
plugins { id "java" id "application" }
version = "1.0.0"
group = "com.kartik.server"
application { mainClass = "com.kartik.server.KartikServer" }
repositories { mavenCentral() maven { url "https://jitpack.io" } }
dependencies {
  implementation "net.minestom:minestom:26.3-0.0.0"
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
jar { manifest { attributes "Main-Class": "com.kartik.server.KartikServer" } }
