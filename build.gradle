plugins {
    id 'java'
    id 'application'
}

version = "1.0.0"
group = "com.kartik.server"

application {
    mainClass = "com.kartik.server.KartikServer"
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation "com.github.Minestom:Minestom:be2a30a"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    manifest {
        attributes "Main-Class": "com.kartik.server.KartikServer"
    }
}
